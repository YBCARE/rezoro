<!DOCTYPE html>
<html lang="en" style="background:#000">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Rezoro</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307070A'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23C9A84C' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
  <link href="/fonts/fonts.css" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#C9A84C;--gold-l:#E4C870;--bg:#07070A;--bg2:#0E0E13;--t1:#F0ECE4;--t2:#9A9490;--t3:#5C5852;--border:rgba(255,255,255,.07);--gold-border:rgba(201,168,76,.22);}
    body{background:var(--bg);color:var(--t1);font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2rem;border-bottom:1px solid var(--border);}
    .nav-logo{font-family:'Cormorant',serif;font-size:1.6rem;font-weight:600;letter-spacing:.06em;color:var(--t1);text-decoration:none;}
    .nav-logo span{color:var(--gold);}
    main{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;}
    .auth-card{width:100%;max-width:440px;background:var(--bg2);border:1px solid var(--gold-border);border-radius:6px;padding:3rem 2.6rem;}
    h1{font-family:'Cormorant',serif;font-size:2rem;font-weight:600;color:var(--t1);margin-bottom:.3rem;}
    .auth-sub{font-size:.8rem;color:var(--t3);margin-bottom:2rem;}
    label{display:block;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:.4rem;margin-top:1.1rem;}
    input{width:100%;padding:.85rem 1rem;background:#141419;border:1px solid rgba(255,255,255,.09);border-radius:3px;color:var(--t1);font-family:'Montserrat',sans-serif;font-size:.95rem;outline:none;-webkit-appearance:none;}
    input:focus{border-color:var(--gold-border);}
    .btn-primary{width:100%;margin-top:1.4rem;padding:1rem;background:var(--gold);color:#000;border:none;border-radius:2px;font-family:'Montserrat',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background .2s;}
    .btn-primary:hover{background:var(--gold-l);}
    .btn-primary:disabled{opacity:.6;cursor:not-allowed;}
    .divider{display:flex;align-items:center;gap:1rem;margin:1.4rem 0;color:var(--t3);font-size:.72rem;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
    .btn-google{width:100%;padding:.9rem;background:transparent;border:1px solid var(--border);border-radius:2px;color:var(--t2);font-family:'Montserrat',sans-serif;font-size:.82rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem;transition:border-color .2s;}
    .btn-google:hover{border-color:var(--gold-border);}
    .err{font-size:.78rem;color:#f87171;margin-top:.7rem;min-height:1em;}
    .auth-switch{text-align:center;margin-top:1.8rem;font-size:.8rem;color:var(--t3);}
    .auth-switch a{color:var(--gold);text-decoration:none;}
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">Rez<span>oro</span></a>
  <a href="signin.html" style="font-size:.78rem;font-weight:600;color:var(--t3);text-decoration:none;">Sign in →</a>
</nav>
<main>
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="auth-sub">Join the world's most exclusive booking platform</p>

    <div id="g_id_onload"
         data-client_id="447130418118-1tr8oo353lip9p0u9sncshjapdqs4qac.apps.googleusercontent.com"
         data-callback="handleGoogleSignIn"
         data-auto_prompt="false">
    </div>
    <div id="g_id_signin" style="width:100%;min-height:44px;display:flex;justify-content:center;"></div>

    <div class="divider">or</div>

    <label>Full Name</label>
    <input type="text" id="su-name" placeholder="Your name" autocomplete="name">
    <label>Email</label>
    <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email">
    <label>Password</label>
    <input type="password" id="su-pass" placeholder="At least 6 characters" autocomplete="new-password"
           onkeydown="if(event.key==='Enter')doSignUp()">
    <button class="btn-primary" id="su-btn" onclick="doSignUp()">Create Account</button>
    <div class="err" id="su-err"></div>

    <div class="auth-switch">Already have an account? <a href="signin.html">Sign in</a></div>
  </div>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
function saveAuth(token, user) {
  localStorage.setItem('rz_token', token);
  localStorage.setItem('rz_user', JSON.stringify(user));
}

async function doSignUp() {
  const name  = document.getElementById('su-name').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const pass  = document.getElementById('su-pass').value;
  const err   = document.getElementById('su-err');
  const btn   = document.getElementById('su-btn');
  err.textContent = '';
  if (!name || !email || !pass) { err.textContent = 'Please fill in all fields.'; return; }
  if (pass.length < 6)          { err.textContent = 'Password must be at least 6 characters.'; return; }
  btn.textContent = 'Creating account…'; btn.disabled = true;
  try {
    const r = await fetch('/api/auth/register', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, password: pass })
    });
    const d = await r.json();
    if (d.token) {
      saveAuth(d.token, d.user);
      window.location.href = 'account.html';
    } else {
      err.textContent = d.error || 'Sign up failed.';
    }
  } catch { err.textContent = 'Connection error. Try again.'; }
  btn.textContent = 'Create Account'; btn.disabled = false;
}

async function handleGoogleSignIn(response) {
  const err = document.getElementById('su-err');
  try {
    const r = await fetch('/api/auth/google', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ credential: response.credential })
    });
    const d = await r.json();
    if (d.token) {
      saveAuth(d.token, d.user);
      window.location.href = 'account.html';
    } else {
      err.textContent = d.error || 'Google sign-in failed.';
    }
  } catch { err.textContent = 'Connection error.'; }
}

// Render Google button once the GSI library is ready (async-safe)
(function waitForGoogle() {
  if (typeof google !== 'undefined' && google.accounts && google.accounts.id) {
    google.accounts.id.renderButton(
      document.getElementById('g_id_signin'),
      { theme: 'filled_black', size: 'large', text: 'signup_with', width: 380, shape: 'rectangular' }
    );
  } else {
    setTimeout(waitForGoogle, 100);
  }
})();
</script>
</body>
</html>
