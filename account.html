<!DOCTYPE html>
<html lang="en" style="background:#000">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Rezoro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--gold:#C9A84C;--gold-l:#E4C870;--bg:#07070A;--bg2:#0E0E13;--bg3:#141419;--t1:#F0ECE4;--t2:#9A9490;--t3:#5C5852;--border:rgba(255,255,255,.07);--gold-border:rgba(201,168,76,.22);}
    body{background:var(--bg);color:var(--t1);font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
    nav{display:flex;align-items:center;justify-content:space-between;padding:1.2rem 2rem;border-bottom:1px solid var(--border);}
    .nav-logo{font-family:'Cormorant',serif;font-size:1.6rem;font-weight:600;letter-spacing:.06em;color:var(--t1);text-decoration:none;}
    .nav-logo span{color:var(--gold);}
    .nav-right{display:flex;align-items:center;gap:1.2rem;}
    .nav-home{font-size:.78rem;font-weight:600;color:var(--t3);text-decoration:none;}
    .nav-signout{font-size:.78rem;font-weight:600;color:var(--gold);background:none;border:none;cursor:pointer;font-family:'Montserrat',sans-serif;}
    main{flex:1;max-width:900px;margin:0 auto;width:100%;padding:3rem 1.5rem 5rem;}
    /* Header */
    .acct-header{display:flex;align-items:center;gap:1.4rem;margin-bottom:3rem;}
    .acct-avatar{width:64px;height:64px;border-radius:50%;background:var(--bg2);border:2px solid var(--gold-border);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:var(--gold);font-family:'Cormorant',serif;flex-shrink:0;}
    .acct-name{font-family:'Cormorant',serif;font-size:1.8rem;font-weight:600;color:var(--t1);}
    .acct-email{font-size:.8rem;color:var(--t3);margin-top:.2rem;}
    /* Tabs */
    .tabs{display:flex;gap:.2rem;margin-bottom:2.4rem;border-bottom:1px solid var(--border);overflow-x:auto;}
    .tab{font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:.85rem 1.4rem;color:var(--t3);border:none;background:none;cursor:pointer;font-family:'Montserrat',sans-serif;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;}
    .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
    .tab-panel{display:none;}
    .tab-panel.active{display:block;}
    /* Cards */
    .card{background:var(--bg2);border:1px solid var(--gold-border);border-radius:16px;padding:2rem;}
    .card+.card{margin-top:1.2rem;}
    .card-title{font-size:.68rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);margin-bottom:1.2rem;}
    /* Booking rows */
    .bk-row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--border);}
    .bk-row:last-child{border-bottom:none;padding-bottom:0;}
    .bk-ref{font-size:.72rem;font-weight:700;letter-spacing:.1em;color:var(--gold);font-family:'Courier New',monospace;}
    .bk-celeb{font-size:.95rem;font-weight:600;color:var(--t1);margin-top:.2rem;}
    .bk-meta{font-size:.75rem;color:var(--t3);margin-top:.3rem;}
    .badge{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.25rem .6rem;border-radius:4px;margin-top:.4rem;}
    .badge-pending{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.3);}
    .badge-accepted{background:rgba(62,207,142,.1);color:#3ecf8e;border:1px solid rgba(62,207,142,.25);}
    .badge-confirmed{background:rgba(99,179,237,.1);color:#63b3ed;border:1px solid rgba(99,179,237,.25);}
    .badge-completed{background:rgba(255,255,255,.06);color:var(--t2);border:1px solid var(--border);}
    .badge-rejected{background:rgba(248,113,113,.1);color:#f87171;border:1px solid rgba(248,113,113,.25);}
    .badge-payment_sent{background:rgba(167,139,250,.1);color:#a78bfa;border:1px solid rgba(167,139,250,.25);}
    .bk-price{font-size:1rem;font-weight:700;color:var(--gold);white-space:nowrap;}
    /* Fan cards */
    .fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;}
    .fc-card{background:var(--bg3);border:1px solid var(--gold-border);border-radius:10px;padding:1.2rem;}
    .fc-emoji{font-size:1.8rem;margin-bottom:.6rem;}
    .fc-celeb{font-size:.9rem;font-weight:600;color:var(--t1);}
    .fc-tier{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:.2rem;}
    .fc-ref{font-size:.65rem;color:var(--t3);margin-top:.4rem;font-family:'Courier New',monospace;}
    /* Profile fields */
    .pf-row{display:flex;justify-content:space-between;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--border);}
    .pf-row:last-child{border-bottom:none;}
    .pf-label{font-size:.68rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);}
    .pf-val{font-size:.9rem;color:var(--t1);}
    /* Newsletter toggle */
    .nl-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;}
    .nl-info h3{font-size:1rem;font-weight:600;color:var(--t1);margin-bottom:.2rem;}
    .nl-info p{font-size:.8rem;color:var(--t3);}
    /* Empty state */
    .empty{text-align:center;padding:3rem 1rem;color:var(--t3);}
    .empty-icon{font-size:2.5rem;margin-bottom:.8rem;}
    .empty-text{font-size:.85rem;}
    /* Loading */
    .loading{text-align:center;padding:2.5rem;color:var(--t3);font-size:.85rem;}
    /* Payment CTA */
    .pay-btn{display:inline-block;background:var(--gold);color:#000;font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;padding:.5rem 1.2rem;border-radius:6px;text-decoration:none;white-space:nowrap;}
    /* Responsive */
    @media(max-width:560px){
      nav{padding:1rem 1.2rem;}
      main{padding:2rem 1rem 4rem;}
      .acct-header{margin-bottom:2rem;}
      .tab{padding:.7rem 1rem;font-size:.7rem;}
    }
  </style>
</head>
<body style="background:#07070A;color:#F0ECE4">
<nav>
  <a href="index.html" class="nav-logo">Rez<span>oro</span></a>
  <div class="nav-right">
    <a href="index.html" class="nav-home">← Home</a>
    <button class="nav-signout" onclick="signOut()">Sign out</button>
  </div>
</nav>

<main>
  <div class="acct-header">
    <div class="acct-avatar" id="av-initials">?</div>
    <div>
      <div class="acct-name" id="av-name">Loading…</div>
      <div class="acct-email" id="av-email"></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('bookings',this)">Bookings</button>
    <button class="tab" onclick="switchTab('fancards',this)">Fan Cards</button>
    <button class="tab" onclick="switchTab('profile',this)">Profile</button>
  </div>

  <!-- BOOKINGS -->
  <div id="tab-bookings" class="tab-panel active">
    <div id="bookings-content" class="loading">Loading bookings…</div>
  </div>

  <!-- FAN CARDS -->
  <div id="tab-fancards" class="tab-panel">
    <div id="fancards-content" class="loading">Loading fan cards…</div>
  </div>

  <!-- PROFILE -->
  <div id="tab-profile" class="tab-panel">
    <div class="card">
      <div class="card-title">Account Details</div>
      <div class="pf-row"><span class="pf-label">Name</span><span class="pf-val" id="pf-name">—</span></div>
      <div class="pf-row"><span class="pf-label">Email</span><span class="pf-val" id="pf-email">—</span></div>
      <div class="pf-row"><span class="pf-label">Member Since</span><span class="pf-val" id="pf-since">—</span></div>
    </div>
  </div>
</main>

<script>
/* ── Auth guard ─────────────────────────────────────────── */
const token = localStorage.getItem('rz_token');
const userRaw = localStorage.getItem('rz_user');
if (!token || !userRaw) { window.location.href = 'signin.html'; }

let currentUser = null;
try { currentUser = JSON.parse(userRaw); } catch {}
if (!currentUser) { window.location.href = 'signin.html'; }

/* ── Populate header ────────────────────────────────────── */
function initHeader() {
  const name = currentUser.name || currentUser.email || 'You';
  document.getElementById('av-name').textContent = name;
  document.getElementById('av-email').textContent = currentUser.email || '';
  const initials = name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
  document.getElementById('av-initials').textContent = initials;
  document.getElementById('pf-name').textContent = currentUser.name || '—';
  document.getElementById('pf-email').textContent = currentUser.email || '—';
  if (currentUser.createdAt) {
    document.getElementById('pf-since').textContent = new Date(currentUser.createdAt).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  }
}
initHeader();

/* ── Tabs ───────────────────────────────────────────────── */
function switchTab(id, el) {
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  el.classList.add('active');
  if (id === 'bookings' && !bookingsLoaded) loadBookings();
  if (id === 'fancards' && !fancardsLoaded) loadFanCards();
}

/* ── Escaping for user-supplied values ──────────────────── */
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Bookings ───────────────────────────────────────────── */
let bookingsLoaded = false;
const statusLabels = {
  pending:      'Pending Review',
  accepted:     'Accepted',
  payment_sent: 'Payment Sent',
  confirmed:    'Confirmed',
  completed:    'Completed',
  rejected:     'Rejected'
};

async function loadBookings() {
  bookingsLoaded = true;
  const el = document.getElementById('bookings-content');
  try {
    const r = await fetch('/api/user/bookings', { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { signOut(); return; }
    const data = await r.json();
    if (!data.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No bookings yet. <a href="index.html" style="color:var(--gold)">Make your first booking →</a></div></div>`;
      return;
    }
    el.innerHTML = data.map(b => {
      const badge = `badge-${b.status}`;
      const statusText = statusLabels[b.status] || b.status;
      const payBtn = (b.status === 'accepted' && b.paymentLink)
        ? `<a href="${b.paymentLink}" target="_blank" class="pay-btn">Pay Now →</a>` : '';
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;">
          <div>
            <div class="bk-ref">${esc(b.ref)}</div>
            <div class="bk-celeb">${esc(b.celebName)}</div>
            <div class="bk-meta">${esc(b.tier)} · ${esc(b.tierType)} · ${esc(b.days)} days</div>
            <div><span class="badge ${badge}">${statusText}</span></div>
          </div>
          <div style="text-align:right;">
            <div class="bk-price">$${Number(b.price).toLocaleString()}</div>
            <div style="font-size:.72rem;color:var(--t3);margin-top:.3rem;">${new Date(b.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
            ${payBtn ? `<div style="margin-top:.6rem;">${payBtn}</div>` : ''}
          </div>
        </div>
        ${b.message ? `<div style="margin-top:.8rem;font-size:.8rem;color:var(--t3);border-top:1px solid var(--border);padding-top:.8rem;">${esc(b.message)}</div>` : ''}
      </div>`;
    }).join('');
  } catch {
    el.innerHTML = `<div class="empty"><div class="empty-text" style="color:#f87171">Failed to load bookings. Try refreshing.</div></div>`;
  }
}
loadBookings();

/* ── Fan Cards ──────────────────────────────────────────── */
let fancardsLoaded = false;
async function loadFanCards() {
  fancardsLoaded = true;
  const el = document.getElementById('fancards-content');
  try {
    const r = await fetch('/api/user/fancards', { headers: { Authorization: 'Bearer ' + token } });
    if (r.status === 401) { signOut(); return; }
    const data = await r.json();
    if (!data.length) {
      el.innerHTML = `<div class="empty"><div class="empty-icon">🎬</div><div class="empty-text">No fan cards yet. <a href="index.html#fancard" style="color:var(--gold)">Create one →</a></div></div>`;
      return;
    }
    const tierEmoji = { gold:'🥇', silver:'🥈', bronze:'🥉' };
    el.innerHTML = `<div class="fc-grid">${data.map(fc=>`
      <div class="fc-card">
        <div class="fc-emoji">${tierEmoji[fc.tier]||'🎬'}</div>
        <div class="fc-celeb">${esc(fc.celebName)}</div>
        <div class="fc-tier">${esc(fc.tier)} tier</div>
        ${fc.country ? `<div style="font-size:.75rem;color:var(--t3);margin-top:.2rem;">📍 ${esc(fc.country)}</div>` : ''}
        <div class="fc-ref">${esc(fc.ref)}</div>
        <div style="font-size:.65rem;color:var(--t3);margin-top:.3rem;">${new Date(fc.createdAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
      </div>`).join('')}</div>`;
  } catch {
    el.innerHTML = `<div class="empty"><div class="empty-text" style="color:#f87171">Failed to load fan cards.</div></div>`;
  }
}

/* ── Sign out ───────────────────────────────────────────── */
function signOut() {
  localStorage.removeItem('rz_token');
  localStorage.removeItem('rz_user');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
